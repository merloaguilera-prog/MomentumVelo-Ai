        &lt;form id=&quot;detector-form&quot;&gt;

            &lt;label for=&quot;detector-confirmation&quot;&gt;Confirmar subida/caída&lt;select id=&quot;detector-confirmation&quot;&gt;&lt;option value=&quot;1&quot;&gt;1 cambio entre cierres&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;2 cambios seguidos&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;3 cambios seguidos&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;

          &lt;label class=&quot;detector-checkbox&quot;&gt;&lt;input id=&quot;detector-volume&quot; type=&quot;checkbox&quot;&gt; Exigir además que el volumen del último cierre sea al menos 1,5 veces la media de los 20 cierres anteriores&lt;/label&gt;

          &lt;details class=&quot;detector-format&quot;&gt;&lt;summary&gt;Cómo preparar el archivo&lt;/summary&gt;&lt;p&gt;Cabeceras: &lt;code&gt;fecha,cierre,volumen&lt;/code&gt; o &lt;code&gt;Date,Close,Volume&lt;/code&gt;. Fechas AAAA-MM-DD, un cierre diario por fecha y un único activo y moneda. Volumen opcional. Hasta 1.000 filas y 256 KB. Admite coma, punto y coma o tabulador; usa punto decimal con CSV separado por comas. Sin separadores de miles.&lt;/p&gt;&lt;p&gt;También admite exportaciones con columnas Open, High y Low; solo utiliza Date, Close y Volume. Usa una serie coherente de precios: cambios de escala, dividendos o desdoblamientos pueden afectar las variaciones. La fuente la declaras tú; MomentumVelo no la certifica.&lt;/p&gt;&lt;/details&gt;

        &lt;div id=&quot;detector-result&quot; hidden&gt;&lt;/div&gt;
        &lt;p class=&quot;workspace-hint&quot;&gt;Las reglas del último análisis se conservan en este navegador; el archivo y los resultados solo duran esta visita. Puedes descargar el histórico validado para guardarlo y volver a cargarlo. No se envía a ningún servidor. No hay avisos con la app cerrada. Una condición cumplida describe los datos cargados, no una recomendación de compra o venta.&lt;/p&gt;

      &lt;div class=&quot;market-notes&quot;&gt;
        &lt;section class=&quot;surface&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;LEE EL DATO&lt;/p&gt;&lt;h2&gt;Precio, moneda y periodo&lt;/h2&gt;&lt;p&gt;El gráfico permite cambiar el periodo y consultar valores históricos. La moneda depende del activo y de la bolsa; no convertimos automáticamente USD a EUR.&lt;/p&gt;&lt;p&gt;El precio de una criptomoneda o divisa corresponde a la fuente seleccionada y puede diferir entre proveedores.&lt;/p&gt;&lt;/section&gt;
        &lt;section class=&quot;surface&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;ALCANCE ACTUAL&lt;/p&gt;&lt;h2&gt;Qué analiza cada herramienta&lt;/h2&gt;&lt;p&gt;Los movimientos y el mapa muestran datos de TradingView. «Mi detector» calcula reglas únicamente sobre el histórico que cargas. El radar Pulse sigue siendo una demostración; no analiza estas cotizaciones ni envía avisos automáticos.&lt;/p&gt;&lt;p&gt;Premium continúa en preparación. Consultar esta página no crea una cuenta ni activa cobros.&lt;/p&gt;&lt;/section&gt;
