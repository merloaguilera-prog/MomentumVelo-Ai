name: Web checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  android-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the launch exception boundary
        run: python3 android/test-launcher.py
      - name: Install Android build components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Compile APK, bundle and Android lint
        working-directory: android
        run: bash gradlew --no-daemon --console=plain assembleDebug bundleRelease lintRelease
      - name: Keep review builds and lint report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MomentumVelo-Android-review-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-release.*
  android-launch:
    needs: android-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: MomentumVelo-Android-review-${{ github.sha }}
          path: android-review
      - name: Enable acceleration on this disposable runner
        run: sudo chmod a+rw /dev/kvm
      - name: Launch this APK three times on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 android/verify-native-startup.py --artifact-dir android-review --output android/qa-output
      - name: Keep native launch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MomentumVelo-native-startup-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: android/qa-output
